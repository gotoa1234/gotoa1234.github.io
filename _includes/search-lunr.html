<script defer src="{{ '/script/lunr/lunr-chinese.js' | relative_url }}"></script>
<script defer src="{{ '/script/lunr/site-search.js' | relative_url }}"></script>

<style>
    #lunrsearchresults {padding-top: 0.2rem;}
    .lunrsearchresult {padding-bottom: 1rem;}
    .lunrsearchresult .title {color: #d9230f;}
    .lunrsearchresult a {display: block; color: #777;}
    .lunrsearchresult a:hover, .lunrsearchresult a:focus {text-decoration: none;}
    .lunrsearchresult a:hover .title {text-decoration: underline;}
</style>

<form id="lunrsearchform" role="search" data-index-url="{{ '/search-index.json' | relative_url }}">
    <p>
        <input type="search" class="form-control" id="lunrsearch" name="query"
               maxlength="255" aria-label="查詢關鍵字" placeholder="查詢關鍵字">
    </p>
    {% if include.show_button %}<button type="submit">搜尋</button>{% endif %}
</form>
<div id="lunrsearchresults">
    <div id="lunrsearchstatus" role="status"></div>
    <ul></ul>
</div>
